[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "demo"
dynamic = ["version"]
description = "A demonstration package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Demo Author", email = "author@example.com" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6,<3", # v1 is not supported
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov"]

[project.scripts]
demo = "demo.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
